"**":
  push:
    - runner:
        cpus: 16
      docker:
        image: docker.io/library/node:22-bookworm@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d
        volumes:
          - /opt/android-sdk:copy-on-write
          - /root/.gradle:copy-on-write
          - /root/.cargo/registry:copy-on-write
          - /root/.cargo/git:copy-on-write
          - /root/.cargo/bin:copy-on-write
          - /root/.rustup:copy-on-write
          - /root/.local/share/pnpm/store:copy-on-write
          - /root/.cache:copy-on-write
          - node_modules:copy-on-write
      imports:
        - https://cnb.cool/Umbrae-Labs/secrets/-/blob/main/expo.yml
      stages:
        - name: Build development APK
          script: bash scripts/build-android.sh development
          timeout: 2h
        - name: Attach development APK
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - ./lunar-development.apk
            ttl: 7

"v*":
  tag_push:
    - lock:
        key: lunar-android-release
        expires: 10800
        wait: true
        timeout: 10800
      runner:
        cpus: 16
      docker:
        image: docker.io/library/node:22-bookworm@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d
        volumes:
          - /opt/android-sdk:copy-on-write
          - /root/.gradle:copy-on-write
          - /root/.cargo/registry:copy-on-write
          - /root/.cargo/git:copy-on-write
          - /root/.cargo/bin:copy-on-write
          - /root/.rustup:copy-on-write
          - /root/.local/share/pnpm/store:copy-on-write
          - /root/.cache:copy-on-write
      imports:
        - https://cnb.cool/Umbrae-Labs/secrets/-/blob/main/expo.yml
        - https://cnb.cool/Umbrae-Labs/secrets/-/blob/main/github-release.yml
      env:
        CI: 'true'
        LUNAR_GITHUB_REPOSITORY: Saramanda9988/lunar
      stages:
        - name: Verify release tag and GitHub destination
          script: node scripts/release.mjs preflight
          timeout: 3m
        - name: Check and build signed release APK
          script: bash scripts/build-android.sh release artifacts/lunar-release.apk
          timeout: 2h
        - name: Publish APK to GitHub Releases
          script: node scripts/release.mjs publish
          timeout: 15m

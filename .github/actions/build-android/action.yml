name: Build Android APK
description: Prepare the GitHub Linux runner and run the existing EAS local build
inputs:
  profile:
    description: EAS APK build profile
    required: true
  expo-token:
    description: Expo project access token
    required: true
runs:
  using: composite
  steps:
    - name: Validate build configuration
      shell: bash
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
        BUILD_PROFILE: ${{ inputs.profile }}
      run: |
        : "${EXPO_TOKEN:?Configure the EXPO_TOKEN repository secret}"
        case "$BUILD_PROFILE" in
          release|nightly|development) ;;
          *) echo '::error::Unsupported APK build profile'; exit 1 ;;
        esac
    - name: Prepare disk space
      shell: bash
      run: |
        set -euo pipefail
        [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux ]]
        df -h "$GITHUB_WORKSPACE" /tmp
        sudo rm -rf -- /usr/share/dotnet /usr/share/swift /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images \
          /usr/local/lib/android/sdk/emulator
        for installed_ndk in /usr/local/lib/android/sdk/ndk/*; do
          [[ -d "$installed_ndk" ]] || continue
          [[ "${installed_ndk##*/}" != 27.1.12297006 ]] || continue
          sudo rm -rf -- "$installed_ndk"
        done
        df -h "$GITHUB_WORKSPACE" /tmp
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
    - name: Build signed APK
      shell: bash
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
        BUILD_PROFILE: ${{ inputs.profile }}
        CI: 'true'
        LUNAR_ANDROID_ABIS: arm64-v8a
        RITO_FFI_REBUILD: '1'
        CARGO_BUILD_JOBS: '2'
      run: |
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
        export ANDROID_NDK="$ANDROID_NDK_HOME"
        export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
        export ANDROID_NDK_LATEST_HOME="$ANDROID_NDK_HOME"
        bash scripts/build-android.sh "$BUILD_PROFILE" "artifacts/lunar-${BUILD_PROFILE}.apk"
    - name: Report disk usage
      if: always()
      shell: bash
      run: |
        df -h "$GITHUB_WORKSPACE" /tmp
        df -i "$GITHUB_WORKSPACE" /tmp

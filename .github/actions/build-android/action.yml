name: Build Android APK on CNB
description: Sync the source commit to CNB, wait for compilation, and download verified assets
inputs:
  profile:
    description: EAS APK build profile
    required: true
  cnb-token:
    description: CNB token with repository code and build trigger read/write permissions
    required: true
  release-tag:
    description: Version tag for a release build
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Build on CNB and retrieve assets
      shell: bash
      env:
        CNB_SECRET: ${{ inputs.cnb-token }}
        BUILD_PROFILE: ${{ inputs.profile }}
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: node scripts/cnb-build.mjs

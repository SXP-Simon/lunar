name: Sync CNB and build development APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-cnb-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync the selected ref to CNB
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e PLUGIN_TARGET_URL="https://cnb.cool/Umbrae-Labs/lunar" \
            -e PLUGIN_AUTH_TYPE="https" \
            -e PLUGIN_USERNAME="cnb" \
            -e PLUGIN_PASSWORD="${{ secrets.CNB_SECRET }}" \
            -e PLUGIN_FORCE="true" \
            -e PLUGIN_PUSH_TAGS="false" \
            tencentcom/git-sync

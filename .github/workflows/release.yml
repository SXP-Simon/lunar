name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  LUNAR_GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version, changelog and destination
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          git checkout --detach "refs/tags/$RELEASE_TAG"
          node scripts/release.mjs preflight "$RELEASE_TAG"
      - uses: ./.github/actions/build-android
        with:
          profile: release
          expo-token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify APK and prepare release assets
        run: node scripts/release.mjs prepare "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: release-android-${{ github.run_id }}
          path: artifacts/
      - name: Publish verified assets, bilingual notes and full changelog link
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish "$RELEASE_TAG"

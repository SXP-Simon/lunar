name: Release Android via CNB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing GitHub tag, for example v1.0.0 or v1.1.0-rc.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  sync-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and check out the release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          git checkout --detach "refs/tags/$RELEASE_TAG"
          node scripts/release.mjs validate "$RELEASE_TAG"

      - name: Sync only this tag to CNB
        shell: bash
        env:
          CNB_SECRET: ${{ secrets.CNB_SECRET }}
        run: |
          : "${CNB_SECRET:?Configure the CNB_SECRET repository secret}"
          ASKPASS="$RUNNER_TEMP/cnb-askpass.sh"
          cat > "$ASKPASS" <<'SCRIPT'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'cnb' ;;
            *Password*) printf '%s\n' "$CNB_SECRET" ;;
          esac
          SCRIPT
          chmod 700 "$ASKPASS"
          trap 'rm -f "$ASKPASS"' EXIT
          export GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0
          git push https://cnb.cool/Umbrae-Labs/lunar.git "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          {
            echo "### Release handed to CNB"
            echo "Tag: $RELEASE_TAG"
            echo "CNB builds: https://cnb.cool/Umbrae-Labs/lunar/-/build"
            echo "The GitHub job confirms tag synchronization. CNB publishes the release after the build succeeds."
            echo "For an existing CNB tag, retry its CNB build; pushing the same tag again does not start another build."
          } >> "$GITHUB_STEP_SUMMARY"

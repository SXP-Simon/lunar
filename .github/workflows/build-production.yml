name: Build production APK on GitHub

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-production-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CI: 'true'
      LUNAR_ANDROID_ABIS: arm64-v8a
      RITO_FFI_REBUILD: '1'
      CARGO_BUILD_JOBS: '2'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Expo authentication configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          : "${EXPO_TOKEN:?Add EXPO_TOKEN in repository Settings > Secrets and variables > Actions}"

      - name: Check out the selected branch or tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Make room for the native Android build
        run: |
          # These preinstalled tools are unused by this Android-only job.
          # Restrict cleanup to GitHub's disposable Linux runners.
          if [[ "$RUNNER_ENVIRONMENT" != github-hosted || "$RUNNER_OS" != Linux ]]; then
            echo '::error::Disk preparation requires a GitHub-hosted Linux runner.'
            exit 1
          fi
          df -h "$GITHUB_WORKSPACE" /tmp
          sudo rm -rf -- \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator
          # The runner includes several NDKs. The build script installs 27.1.12297006.
          for installed_ndk in /usr/local/lib/android/sdk/ndk/*; do
            [[ -d "$installed_ndk" ]] || continue
            [[ "${installed_ndk##*/}" != 27.1.12297006 ]] || continue
            du -sh "$installed_ndk"
            sudo rm -rf -- "$installed_ndk"
          done
          df -h "$GITHUB_WORKSPACE" /tmp
          # EAS creates another project copy; Gradle, Rust and C++ add build outputs.
          # 30 GiB is an estimate, not a measured minimum for this project.
          for build_directory in "$GITHUB_WORKSPACE" /tmp; do
            available_kib=$(df -Pk "$build_directory" | awk 'NR == 2 { print $4 }')
            if (( available_kib < 30 * 1024 * 1024 )); then
              echo "::warning::Free space on $build_directory is below the estimated 30 GiB budget; continuing the build to measure actual requirements."
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build signed production APK locally on GitHub
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Replace runner defaults that refer to the removed preinstalled NDKs.
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          export ANDROID_NDK="$ANDROID_NDK_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export ANDROID_NDK_LATEST_HOME="$ANDROID_NDK_HOME"
          bash scripts/build-android.sh release artifacts/lunar-production.apk

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: lunar-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/lunar-production.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Report final disk usage
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE" /tmp
          df -i "$GITHUB_WORKSPACE" /tmp
          du -sh "$HOME/.gradle" "$HOME/.cargo" "$RUNNER_TEMP" /tmp/runner 2>/dev/null || true

      - name: Record build details
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          {
            echo "### Production Android build"
            echo "Commit: $BUILD_COMMIT"
            echo 'Profile: release (extends production); ABI: arm64-v8a'
            echo 'Download lunar-production.apk from this run’s Artifacts section.'
          } >> "$GITHUB_STEP_SUMMARY"

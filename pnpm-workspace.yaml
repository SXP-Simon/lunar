packages:
  - '.'

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Expo SDK patch packages must remain in the same release set.
  - '@expo/*'
  - expo
  - expo-*
  - babel-preset-expo

allowBuilds:
  '@shopify/react-native-skia': true
  esbuild: true
  unrs-resolver: true

# standard-navigation imports React without declaring it as a runtime dependency.
packageExtensions:
  'standard-navigation@0.0.5':
    dependencies:
      react: 19.2.3

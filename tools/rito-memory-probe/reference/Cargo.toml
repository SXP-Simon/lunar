[package]
name = "rito-memory-probe-reference"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "rito-memory-probe-reference"
path = "../src/main.rs"

[features]
default = ["reference"]
current = []
reference = []

[dependencies]
memory-stats = "1.2.0"
rito-core-reference = { package = "rito-core", path = "../../../lib/Rito/crates/rito-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"


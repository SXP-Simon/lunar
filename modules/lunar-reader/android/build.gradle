plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.lunarain_079'
version = '1.0.0'

def expoModulesCoreProject = project(':expo-modules-core')
def workletsProject = project(':react-native-worklets')
def expoModulesCoreDir = expoModulesCoreProject.projectDir.parentFile
def reactNativeWorkletsDir = workletsProject.projectDir.parentFile

android {
  namespace 'expo.modules.lunarreader'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'proguard-rules.pro'
    externalNativeBuild {
      cmake {
        abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        arguments '-DANDROID_STL=c++_shared',
          '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
          "-DREACT_NATIVE_DIR=${rootProject.file('../node_modules/react-native').absolutePath}",
          "-DEXPO_MODULES_CORE_DIR=${expoModulesCoreDir.absolutePath}",
          "-DREACT_NATIVE_WORKLETS_DIR=${reactNativeWorkletsDir.absolutePath}"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
    }
  }
  buildFeatures {
    // Makes Prefab packages from native dependencies available to CMake.
    prefab true
  }
  packagingOptions {
    excludes += [
      '**/libc++_shared.so',
      '**/libexpo-modules-core.so',
      '**/libfbjni.so',
      '**/libworklets.so',
    ]
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation project(':expo-modules-core')
  implementation project(':react-native-worklets')
  compileOnly 'com.facebook.fbjni:fbjni:0.5.1'
}

evaluationDependsOn(expoModulesCoreProject.path)
evaluationDependsOn(workletsProject.path)

afterEvaluate {
  tasks.named('buildCMakeDebug').configure {
    dependsOn(expoModulesCoreProject.tasks.named('mergeDebugNativeLibs'))
    dependsOn(workletsProject.tasks.named('mergeDebugNativeLibs'))
  }
  tasks.named('buildCMakeRelWithDebInfo').configure {
    dependsOn(expoModulesCoreProject.tasks.named('mergeReleaseNativeLibs'))
    dependsOn(workletsProject.tasks.named('mergeReleaseNativeLibs'))
  }
}

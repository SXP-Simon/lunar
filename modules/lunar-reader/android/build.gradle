plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.lunarain_079'
version = '1.0.0'

android {
  namespace 'expo.modules.lunarreader'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'proguard-rules.pro'
    externalNativeBuild {
      cmake {
        abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        arguments '-DANDROID_STL=c++_shared',
          "-DREACT_NATIVE_DIR=${rootProject.file('../node_modules/react-native').absolutePath}",
          "-DEXPO_MODULES_CORE_DIR=${rootProject.file('../node_modules/expo-modules-core').absolutePath}",
          "-DREACT_NATIVE_WORKLETS_DIR=${rootProject.file('../node_modules/react-native-worklets').absolutePath}"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
    }
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation project(':react-native-worklets')
}

def workletsProject = findProject(':react-native-worklets')
if (workletsProject != null) {
  afterEvaluate {
    tasks.named('buildCMakeDebug').configure {
      dependsOn(workletsProject.tasks.named('mergeDebugNativeLibs'))
    }
    tasks.named('buildCMakeRelWithDebInfo').configure {
      dependsOn(workletsProject.tasks.named('mergeReleaseNativeLibs'))
    }
  }
}
